idempotency:
  supported: false
  detail: >-
    Up does not document an Idempotency-Key header or any client-supplied
    idempotency contract. Write operations are limited to webhook create/delete,
    tag add/remove, and transaction categorisation; none accept an idempotency
    key. Retries are not deduplicated by the API.
pagination:
  style: cursor
  request_params: ["page[size]", "page[after]", "page[before]"]
  response_fields: ["links.prev", "links.next"]
  detail: >-
    Lists are cursor-paginated. Set page[size] for page length; follow the
    opaque links.next / links.prev URLs (which carry page[after] / page[before]
    cursors) to scroll. filter[since] / filter[until] narrow by date range and
    must NOT be used for pagination.
filtering:
  detail: >-
    JSON:API-style filter[...] query parameters: filter[accountType],
    filter[ownershipType], filter[status], filter[category], filter[tag],
    filter[since], filter[until], filter[parent].
field_expansion:
  supported: false
  detail: >-
    No sparse-fieldset or include/expand parameter. Related resources are
    reached by following relationships[].links.related URLs.
metadata:
  detail: >-
    The /util/ping response carries a meta object (authenticated customer id +
    statusEmoji). Resource payloads do not carry arbitrary user metadata; free
    text is available via transaction message/note and user-defined tags.
