summary: >-
  The Up Personal Banking API is rate limited. Up documents a 429 "Too many
  requests" response and an X-RateLimit-Remaining response header that reports
  how many requests remain in the current window. Specific numeric thresholds
  and the window length are not published.
signals:
  status_code: 429
  headers:
