apis:
- aid: up-bank:up-cdr-product-reference-data-api
  name: Up CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#consumer-data-standards-banking-apis
  baseURL: https://api.up.com.au/cds-au/v1/banking/products
  properties:
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#consumer-data-standards-banking-apis
    type: APIReference
  - url: openapi/up-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Product Reference Data (PRD) API mandated for
    all Australian data holders under the Consumer Data Right. Confirmed live at
    https://api.up.com.au/cds-au/v1/banking/products (HTTP 200, x-v 3) returning a
    data.products array (4 products - Up Everyday, Up Saver, Up Essentials Saver, Up
    Home Loan) with fees, rates, and eligibility. Conforms to the DSB Consumer Data
    Standards Banking APIs (Get Products / Get Product Detail); the harvested OpenAPI
    is the shared CDS standard contract, not an Up-proprietary spec.
- aid: up-bank:up-personal-banking-api
  name: Up Personal Banking API
  tags:
  - Banking
  - Transactions
  - Accounts
  - Webhooks
  - Personal Finance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.up.com.au/
  baseURL: https://api.up.com.au/api/v1
  properties:
