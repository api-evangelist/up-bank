aid: up-bank
url: https://raw.githubusercontent.com/api-evangelist/up-bank/refs/heads/main/apis.yml
name: Up
kind: company
description: Up is an Australian digital-only neobank founded in 2018 as a collaboration
  between Melbourne software company Ferocia and Bendigo and Adelaide Bank. Up is not
  a mutual and is not separately licensed; it operates as a brand of ASX-listed Bendigo
  and Adelaide Bank, which holds the Authorised Deposit-taking Institution (ADI) licence,
  provides the underlying deposit products, and acquired full ownership of Ferocia
  and Up in 2021. Marketed as Australia's first fully cloud-hosted bank, Up serves
  more than one million customers through a mobile-first app with no monthly account
  fees, high-interest savers, and rich transaction categorisation. Up has a strong
  public API posture for its size - it exposes both a documented personal-banking
  developer API (accounts, transactions, tags, webhooks) and, as required of every
  Australian data holder under the Consumer Data Right (CDR / Open Banking), a public,
  unauthenticated Product Reference Data (PRD) API conforming to the DSB Consumer Data
  Standards.
