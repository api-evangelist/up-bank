  description: Consumer-authorized CDR Banking surface covering Get Payees and Get
    Payee Detail (saved payee lists). Accessed only via the CDR accredited data
    recipient model under active customer consent (FAPI/mTLS) - not public. Contract
    is the shared DSB Consumer Data Standards Banking API v1.36.0 (payees paths), not
    an Up-proprietary spec.
- aid: up-bank:up-personal-banking-api
  name: Up Personal Banking API
  tags:
  - Banking
  - Transactions
  - Accounts
  - Webhooks
  - Personal Finance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.up.com.au/
  baseURL: https://api.up.com.au/api/v1
  properties:
