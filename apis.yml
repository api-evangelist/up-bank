    type: Documentation
  - url: https://developer.up.com.au/#welcome
    type: APIReference
  - url: openapi/up-bank-openapi.json
    type: OpenAPI
  - url: https://github.com/up-banking/api
    type: SourceCode
  description: Up's own documented personal-banking developer API (v1, beta), giving
    account holders programmatic read access to accounts and transaction data plus
    management of categories, tags, attachments, and webhooks for real-time transaction
    events. Authenticated with a Personal Access Token (Bearer) obtained in the Up
    app or at api.up.com.au; currently scoped to personal use. The bank-specific
    OpenAPI 3.0.3 contract (17 paths) is published at github.com/up-banking/api and
    harvested verbatim.
